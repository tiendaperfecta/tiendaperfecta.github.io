name: Axum data refresh

# Baja los datos de Axum (Orders360 + GPS) y commitea los JSON que consume el panel.
on:
  schedule:
    # Cada 1 hora, de 8:00 a 21:00 hora argentina (UTC-3 => 11:00-23:00 y 00:00 UTC).
    - cron: "0 0,11-23 * * *"
  workflow_dispatch: {}   # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: axum-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Fetch Axum data
        env:
          AXUM_ORDERS_USER: ${{ secrets.AXUM_ORDERS_USER }}
          AXUM_ORDERS_PASS: ${{ secrets.AXUM_ORDERS_PASS }}
          GPS_USER: ${{ secrets.GPS_USER }}
          GPS_PASS: ${{ secrets.GPS_PASS }}
        run: python tools/axum_fetch.py

      - name: Commit data if changed
        run: |
          git config user.name  "axum-bot"
          git config user.email "axum-bot@users.noreply.github.com"
          git add axum/data/*.json
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
            exit 0
          fi
          git commit -m "chore(axum): refresh data $(date -u +%FT%TZ)"
          # Otro commit (Pages, o un push manual) puede haber llegado mientras
          # corriamos: reintentamos rebasando antes de rendirnos.
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rechazado, reintento $i tras rebase..."
            git pull --rebase origin "${GITHUB_REF_NAME}" || exit 1
            sleep 5
          done
          echo "::error title=Axum::No se pudo pushear los datos tras 3 intentos."
          exit 1

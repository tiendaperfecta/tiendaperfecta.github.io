name: Disponibilidad PepsiCo data refresh

# Arma los JSON de disponibilidad/ (pagina Disponibilidad PepsiCo de la Central): lista de
# activos del mes (Excel subido a disponibilidad/listas/), remitos de ingreso de PepsiCo de
# Gescom y stock de la base propia.
on:
  schedule:
    # Lunes a sabado, 08:07 y 14:07 hora argentina (11:07 y 17:07 UTC).
    - cron: "7 11,17 * * 1-6"
  push:
    # Al subir la lista del mes (o cambiar el script) se recalcula enseguida.
    paths:
      - "disponibilidad/listas/**"
      - "tools/pepsico_disponibilidad.py"
      - ".github/workflows/disponibilidad-data.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: disponibilidad-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests openpyxl

      - name: Fetch Disponibilidad data
        env:
          # Compras: directo a Gescom (la base no guarda los renglones de compras).
          GESCOM_REALM: ${{ secrets.GESCOM_REALM }}
          GESCOM_CLIENT_ID: ${{ secrets.GESCOM_CLIENT_ID }}
          GESCOM_USERNAME: ${{ secrets.GESCOM_USERNAME }}
          GESCOM_PASSWORD: ${{ secrets.GESCOM_PASSWORD }}
          # Stock y nombres: de la base propia.
          BASE_CLAVE: ${{ secrets.BASE_CLAVE }}
        run: python tools/pepsico_disponibilidad.py

      - name: Commit data if changed
        run: |
          git config user.name  "disponibilidad-bot"
          git config user.email "disponibilidad-bot@users.noreply.github.com"
          git add -A disponibilidad/
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
            exit 0
          fi
          git commit -m "chore(disponibilidad): refresh data $(date -u +%FT%TZ)"
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rechazado, reintento $i tras rebase..."
            git pull --rebase origin "${GITHUB_REF_NAME}" || exit 1
            sleep 5
          done
          echo "::error title=Disponibilidad::No se pudo pushear los datos tras 3 intentos."
          exit 1

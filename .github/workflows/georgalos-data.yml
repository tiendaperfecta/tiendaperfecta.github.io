name: Georgalos data refresh

# Baja de GesCom la venta de Georgalos del mes (dia por dia) y commitea los
# JSON que lee el panel: georgalos/indice.json, maestro.json y meses/*.json.
on:
  schedule:
    # Cada 1 hora, de lunes a sabado, hora argentina (UTC-3). El cron corre en
    # UTC, asi que va partido para que el corte caiga en el dia argentino:
    #   00:00-20:00 AR lun-sab = 03:00-23:00 UTC lun-sab
    #   21:00-23:00 AR lun-sab = 00:00-02:00 UTC mar-dom
    # El script calcula la fecha en hora argentina.
    - cron: "0 3-23 * * 1-6"
    - cron: "0 0-2 * * 0,2-6"
  workflow_dispatch: {}   # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: georgalos-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Fetch Georgalos data
        env:
          GESCOM_REALM: ${{ secrets.GESCOM_REALM }}
          GESCOM_CLIENT_ID: ${{ secrets.GESCOM_CLIENT_ID }}
          GESCOM_USERNAME: ${{ secrets.GESCOM_USERNAME }}
          GESCOM_PASSWORD: ${{ secrets.GESCOM_PASSWORD }}
        run: python tools/georgalos.py

      - name: Commit data if changed
        run: |
          git config user.name  "georgalos-bot"
          git config user.email "georgalos-bot@users.noreply.github.com"
          git add -A georgalos/
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
            exit 0
          fi
          git commit -m "chore(georgalos): refresh data $(date -u +%FT%TZ)"
          # La Action de Axum commitea cada hora: si llego antes, rebasamos.
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rechazado, reintento $i tras rebase..."
            git pull --rebase origin "${GITHUB_REF_NAME}" || exit 1
            sleep 5
          done
          echo "::error title=Georgalos::No se pudo pushear los datos tras 3 intentos."
          exit 1

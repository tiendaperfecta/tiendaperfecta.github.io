name: Pepsico API probe (temporal)

# Exploracion puntual de la API de GesCom para armar el generador de datos del
# panel Avance PepsiCo. Solo corre a mano. No toca main: commitea el resultado
# en la misma rama pepsico-generador.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pepsico-generador

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Run probe
        env:
          GESCOM_REALM: ${{ secrets.GESCOM_REALM }}
          GESCOM_CLIENT_ID: ${{ secrets.GESCOM_CLIENT_ID }}
          GESCOM_USERNAME: ${{ secrets.GESCOM_USERNAME }}
          GESCOM_PASSWORD: ${{ secrets.GESCOM_PASSWORD }}
        run: python tools/pepsico_probe.py

      - name: Commit probe result
        run: |
          git config user.name  "pepsico-probe-bot"
          git config user.email "pepsico-probe-bot@users.noreply.github.com"
          git add tools/_pepsico_probe.json
          if git diff --cached --quiet; then
            echo "Sin resultado nuevo."
            exit 0
          fi
          git commit -m "chore(pepsico): resultado de sondeo de API $(date -u +%FT%TZ)"
          git push origin HEAD:pepsico-generador

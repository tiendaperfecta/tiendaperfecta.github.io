name: Axum probe cobros (una vez)

# Prueba de solo lectura, a mano: ¿Axum tiene los cobros de los choferes? Imprime solo
# estructura (campos y cantidades), nunca datos: el repo es público. Borrar después de usar.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Probar
        env:
          AXUM_ORDERS_USER: ${{ secrets.AXUM_ORDERS_USER }}
          AXUM_ORDERS_PASS: ${{ secrets.AXUM_ORDERS_PASS }}
          GPS_USER: ${{ secrets.GPS_USER }}
          GPS_PASS: ${{ secrets.GPS_PASS }}
        run: python tools/axum_probe_cobros.py && python tools/axum_probe_ldr.py

<style>
:root{
  --bg:#f4f5f7; --panel:#fff; --txt:#1d2430; --sub:#5d6675; --linea:#dfe3e8; --cab:#1f3a5f; --cabtxt:#fff;
  --finde:#eceef2; --feriado:#fde8d7; --hoy:#fff6c2; --verde:#cdeccf; --verdeb:#2e7d32; --rojo:#f8d0cf; --rojob:#c62828;
  --cheque:#eef3fb; --prov:#f7f4ec; --total:#e6ebf2; --acento:#1f6feb; --neg:#c62828;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#14171c; --panel:#1c2027; --txt:#e6e9ee; --sub:#9aa3b2; --linea:#2d333d; --cab:#22344f; --cabtxt:#e6e9ee;
  --finde:#232831; --feriado:#3a2a1e; --hoy:#3a3618; --verde:#1f4524; --verdeb:#7fd58a; --rojo:#4a1f1f; --rojob:#ff8a80;
  --cheque:#1d2635; --prov:#26241d; --total:#262d38; --acento:#5aa2ff; --neg:#ff8a80;
}}
:root[data-theme="dark"]{
  --bg:#14171c; --panel:#1c2027; --txt:#e6e9ee; --sub:#9aa3b2; --linea:#2d333d; --cab:#22344f; --cabtxt:#e6e9ee;
  --finde:#232831; --feriado:#3a2a1e; --hoy:#3a3618; --verde:#1f4524; --verdeb:#7fd58a; --rojo:#4a1f1f; --rojob:#ff8a80;
  --cheque:#1d2635; --prov:#26241d; --total:#262d38; --acento:#5aa2ff; --neg:#ff8a80;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:13px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,select,input{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--linea);border-radius:6px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--acento)}
button.pri{background:var(--acento);border-color:var(--acento);color:#fff}
select,input[type=text],input[type=number],input[type=date]{background:var(--panel);border:1px solid var(--linea);border-radius:6px;padding:6px 8px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--linea);position:sticky;top:0;z-index:20}
header h1{font-size:16px;margin:0 12px 0 0}
.grupo{display:flex;gap:4px;align-items:center}
.seg button{border-radius:0;margin-left:-1px}.seg button:first-child{border-radius:6px 0 0 6px}.seg button:last-child{border-radius:0 6px 6px 0}
.seg button.on{background:var(--cab);color:var(--cabtxt);border-color:var(--cab)}
.esp{flex:1}
main{padding:12px 16px 40px}
.tarjetas{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:12px}
.tarjeta{background:var(--panel);border:1px solid var(--linea);border-radius:8px;padding:10px 12px}
.tarjeta .t{color:var(--sub);font-size:12px}.tarjeta .v{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.tarjeta .s{color:var(--sub);font-size:11px;margin-top:2px}
.neg{color:var(--neg)}
.leyenda{display:flex;flex-wrap:wrap;gap:12px;color:var(--sub);font-size:12px;margin:0 0 8px}
.leyenda i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px;border:1px solid var(--linea)}
.tablawrap{overflow:auto;background:var(--panel);border:1px solid var(--linea);border-radius:8px;max-height:calc(100vh - 230px)}
table.flujo{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;white-space:nowrap}
.flujo th,.flujo td{border-right:1px solid var(--linea);border-bottom:1px solid var(--linea);padding:4px 7px;text-align:right}
.flujo thead th{position:sticky;top:0;background:var(--cab);color:var(--cabtxt);font-weight:600;font-size:11px;white-space:normal;min-width:92px;max-width:120px;vertical-align:bottom;z-index:3;text-align:center}
.flujo thead tr.grupoc th{top:0;font-size:11px;letter-spacing:.04em}
.flujo thead tr.grupoc th{height:22px;padding:2px 6px}
.flujo thead tr.cols th{top:22px}
.flujo th.fecha,.flujo td.fecha{position:sticky;left:0;z-index:2;text-align:left;min-width:118px;background:var(--panel)}
.flujo thead th.fecha{z-index:4;background:var(--cab)}
.flujo th.tipo-cheque{background:#2f5a8c}.flujo th.tipo-proveedor{background:#5a4a24}
.flujo th.calc{background:#11263f}
.flujo td.tipo-cheque{background:var(--cheque)}.flujo td.tipo-proveedor{background:var(--prov)}
.flujo tr.finde td{background:var(--finde)}
.flujo tr.feriado td{background:var(--feriado)}
.flujo tr.hoy td{box-shadow:inset 0 2px 0 var(--acento),inset 0 -2px 0 var(--acento)}
.flujo tr.finde td.fecha,.flujo tr.feriado td.fecha{color:var(--sub)}
.flujo td.m{cursor:pointer;user-select:none}
.flujo td.m:hover{outline:2px solid var(--acento);outline-offset:-2px}
.flujo td.ok{background:var(--verde)!important;color:var(--verdeb);font-weight:600}
.flujo td.no{background:var(--rojo)!important;color:var(--rojob);font-weight:600}
.flujo td.calc{background:var(--total);font-weight:600}
.flujo td.nota::after{content:"•";color:var(--acento);margin-left:3px}
.flujo td.fac{box-shadow:inset 3px 0 0 #8b5cf6}
.flujo tr.venc td{background:var(--rojo);font-weight:600}
.flujo tfoot td{position:sticky;bottom:0;background:var(--total);font-weight:700;z-index:1}
.flujo tfoot td.fecha{z-index:3;background:var(--total)}
.diasem{display:inline-block;width:28px;color:var(--sub);font-size:11px}
.fer{display:block;font-size:10px;color:#b4590f;white-space:normal;max-width:110px}
.badge{font-size:9px;border-radius:3px;padding:0 3px;margin-left:4px;vertical-align:1px;border:1px solid currentColor}
.b-r{color:var(--verdeb)}.b-e{color:var(--sub)}.b-w{color:#b4590f}
.rec{cursor:pointer}
/* anual */
.anual{overflow:auto}
.anual table{border-collapse:collapse;width:100%;background:var(--panel);font-variant-numeric:tabular-nums}
.anual th,.anual td{border:1px solid var(--linea);padding:6px 8px;text-align:right}
.anual th{background:var(--cab);color:var(--cabtxt)}
.anual td:first-child,.anual th:first-child{text-align:left}
.anual tr.click{cursor:pointer}.anual tr.click:hover td{background:var(--hoy)}
.calendarios{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:14px}
.cal{background:var(--panel);border:1px solid var(--linea);border-radius:8px;padding:8px;cursor:pointer}
.cal h4{margin:0 0 6px;font-size:13px;display:flex;justify-content:space-between}
.cal .g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal .g div{font-size:10px;text-align:center;padding:4px 0;border-radius:3px}
.cal .g .dn{color:var(--sub);font-weight:600}
.cal .g .fd{background:var(--finde);color:var(--sub)}
.cal .g .fe{background:var(--feriado);color:#b4590f;font-weight:700}
.cal .g .hy{outline:2px solid var(--acento)}
.cal .g .pos{box-shadow:inset 0 -3px 0 #43a047}.cal .g .ng{box-shadow:inset 0 -3px 0 #e53935}
/* panel lateral y modal */
.cajon{position:fixed;top:0;right:0;height:100vh;width:min(440px,100vw);background:var(--panel);border-left:1px solid var(--linea);z-index:40;transform:translateX(100%);transition:transform .2s;overflow:auto;padding:14px 16px}
.cajon.abierto{transform:none;box-shadow:-8px 0 24px rgba(0,0,0,.18)}
.cajon h3{margin:16px 0 8px;font-size:14px}.cajon h3:first-of-type{margin-top:4px}
.fila{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap;align-items:center}
.fila label{min-width:80px;color:var(--sub)}
.fila input,.fila select{flex:1;min-width:120px}
.lista{font-size:12px;border:1px solid var(--linea);border-radius:6px;max-height:260px;overflow:auto}
.lista div{display:flex;gap:6px;padding:4px 6px;border-bottom:1px solid var(--linea);align-items:center}
.lista div span.x{margin-left:auto}
.zona{border:2px dashed var(--linea);border-radius:8px;padding:14px;text-align:center;color:var(--sub);cursor:pointer}
.zona.sobre{border-color:var(--acento);color:var(--txt)}
.fondo{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
.fondo.on{display:flex}
.modal{background:var(--panel);border-radius:10px;padding:16px;width:min(560px,100%);max-height:90vh;overflow:auto;border:1px solid var(--linea)}
.modal h3{margin:0 0 10px}
.modal table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
.modal td,.modal th{border-bottom:1px solid var(--linea);padding:3px 4px;text-align:left}
.modal td.n{text-align:right}
.aviso{font-size:12px;color:var(--sub);margin:6px 0}
#puerta{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
#puerta .modal{max-width:380px;text-align:center}
#puerta input{width:100%;margin:10px 0;padding:10px}
#puerta .err{color:var(--neg);min-height:1.2em;font-size:12px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--cab);color:var(--cabtxt);padding:8px 14px;border-radius:6px;z-index:60;display:none}
@media (max-width:700px){ header h1{width:100%} main{padding:10px} .tablawrap{max-height:none} }
@media print{ header,.cajon,.leyenda,.noprint{display:none!important} .tablawrap{max-height:none;overflow:visible;border:0} body{background:#fff} }
</style>

<body>
<header>
  <h1>💵 Flujo de Caja vs Pagos Futuros — TP-RL</h1>
  <div class="grupo seg" id="vistaSeg"><button data-v="mes" class="on">Mes</button><button data-v="anio">Año</button></div>
  <div class="grupo"><button id="ant" title="Anterior">◀</button><select id="selMes"></select><select id="selAnio"></select><button id="sig" title="Siguiente">▶</button><button id="btnHoy">Hoy</button></div>
  <div class="grupo"><label class="aviso" for="modoRec" style="margin:0">Recaudación:</label>
    <select id="modoRec" title="Qué recaudación usar para el saldo">
      <option value="mixto">Real si hay datos, si no estimada</option>
      <option value="real">Solo real (caja + transferencias)</option>
      <option value="est">Solo estimada</option>
    </select></div>
  <div class="esp"></div>
  <button id="btnCajon" class="pri">➕➖ Agregar / Quitar</button>
  <button id="btnImport">📥 Importar</button>
  <button id="btnMas">⚙️</button>
</header>
<main id="main"></main>
<div id="puerta"><form class="modal" id="fPuerta">
  <h3>💵 Flujo de Caja TP-RL</h3>
  <p class="aviso">Los datos están cifrados. Ingresá la clave del panel.</p>
  <input type="password" id="pw" placeholder="Clave" autocomplete="current-password" autofocus>
  <div class="aviso" id="pwMay" style="visibility:hidden;margin:0">⇪ Bloq Mayús activado</div>
  <div class="err" id="pwErr"></div>
  <button class="pri" style="width:100%">Entrar</button>
  <p class="aviso" id="pwFecha"></p>
</form></div>

<aside class="cajon" id="cajon">
  <div class="fila" style="justify-content:space-between"><b id="cajonTitulo">Agregar / Quitar</b><button data-cerrar>✕</button></div>
  <div id="cajonCuerpo"></div>
</aside>
<div class="fondo" id="fondo"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="archivo" multiple accept=".xls,.xlsx,.csv,.json" style="display:none">

<script>
let SEED = null;
const CLAVE = 'flujoCajaTP.v1';
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DIAS = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const EXCLUIR_DEF = 'deposito en efectivo|dep\\.? ?efvo|cuenta propia|rescate|prestamo|descuento documento|rechazad|anulacion|devolucion';
const FERIADOS_DEF = {
 '2025-01-01':'Año Nuevo','2025-03-03':'Carnaval','2025-03-04':'Carnaval','2025-03-24':'Día de la Memoria','2025-04-02':'Malvinas',
 '2025-04-17':'Jueves Santo (no laborable)','2025-04-18':'Viernes Santo','2025-05-01':'Día del Trabajador','2025-05-02':'Puente turístico',
 '2025-05-25':'Revolución de Mayo','2025-06-16':'Güemes','2025-06-20':'Belgrano','2025-07-09':'Independencia','2025-08-15':'Puente turístico',
 '2025-08-17':'San Martín','2025-10-12':'Diversidad Cultural','2025-11-21':'Puente turístico','2025-11-24':'Soberanía Nacional',
 '2025-12-08':'Inmaculada Concepción','2025-12-25':'Navidad',
 '2026-01-01':'Año Nuevo','2026-02-16':'Carnaval','2026-02-17':'Carnaval','2026-03-23':'Puente turístico','2026-03-24':'Día de la Memoria',
 '2026-04-02':'Malvinas / Jueves Santo','2026-04-03':'Viernes Santo','2026-05-01':'Día del Trabajador','2026-05-25':'Revolución de Mayo',
 '2026-06-15':'Güemes','2026-06-20':'Belgrano','2026-07-09':'Independencia','2026-07-10':'Puente turístico','2026-08-17':'San Martín',
 '2026-10-12':'Diversidad Cultural','2026-11-23':'Soberanía Nacional','2026-12-07':'Puente turístico','2026-12-08':'Inmaculada Concepción',
 '2026-12-25':'Navidad',
 '2027-01-01':'Año Nuevo','2027-02-08':'Carnaval','2027-02-09':'Carnaval','2027-03-24':'Día de la Memoria','2027-03-25':'Jueves Santo (no laborable)',
 '2027-03-26':'Viernes Santo','2027-04-02':'Malvinas','2027-05-01':'Día del Trabajador','2027-05-25':'Revolución de Mayo','2027-06-20':'Belgrano',
 '2027-06-21':'Güemes','2027-07-09':'Independencia','2027-08-16':'San Martín','2027-10-11':'Diversidad Cultural','2027-11-20':'Soberanía Nacional',
 '2027-12-08':'Inmaculada Concepción','2027-12-25':'Navidad'
};

/* ================== estado ================== */
function nuevoEstado(){
  const s = JSON.parse(JSON.stringify(SEED));
  return { v:1, columnas:s.columnas, pagos:s.pagos, estimado:s.estimado, vencido:s.vencido, saldoInicial:s.saldoInicial,
    caja:s.caja, bancos:s.bancos, ajustes:{}, notas:{}, estados:{}, exclGrupo:{}, excluir:EXCLUIR_DEF,
    feriados:{...FERIADOS_DEF}, arrastrar:false, modoRec:'mixto', log:[], fuentes:s.fuentes, archivosBanco:s.archivosBanco };
}
let E = null;
/* Cuando se publica un data.enc.json nuevo, se suma a lo que ya hay en este navegador:
   caja, bancos y estimados se actualizan; los pagos se actualizan sólo en los días
   que nadie tocó a mano desde acá (E.tocados). Marcas verdes/rojas y ajustes se conservan. */
function fusionarSeed(){
  if (E.seedVer === SEED.generado) return;
  E.tocados = E.tocados || {};
  for (const c of SEED.columnas) if (!E.columnas.find(x=>x.key===c.key)) E.columnas.push(c);
  Object.assign(E.caja, SEED.caja); Object.assign(E.bancos, SEED.bancos);
  for (const [f,v] of Object.entries(SEED.estimado)) if (!E.tocados[f]) E.estimado[f]=v;
  for (const [f,p] of Object.entries(SEED.pagos)) if (!E.tocados[f]) E.pagos[f]=p;
  for (const [k,v] of Object.entries(SEED.vencido)) if (!E.vencido[k]) E.vencido[k]=v;
  for (const [k,v] of Object.entries(SEED.saldoInicial)) if (!(k in E.saldoInicial)) E.saldoInicial[k]=v;
  E.fuentes = SEED.fuentes; E.archivosBanco = SEED.archivosBanco; E.seedVer = SEED.generado;
  guardar();
}
function iniciar(){
  try { E = JSON.parse(localStorage.getItem(CLAVE)); } catch(e) { E = null; }
  if (!E || !E.columnas) { E = nuevoEstado(); E.seedVer = SEED.generado; guardar(); }
  else fusionarSeed();
  recExcl(); indexarFacturas(); render(); setTimeout(irAHoy,50);
}
const b64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
async function descifrar(env, clave){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(clave), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(env.salt), iterations:env.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(env.iv)}, key, b64(env.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
let ENV = null;
// La clave no distingue mayúsculas ni espacios: tools/flujo.py cifra con la clave en minúsculas.
// Los datos se vuelven a bajar en cada intento: si se probó mientras GitHub publicaba una versión
// nueva, no queda pegado el archivo viejo (cifrado con otra clave) hasta recargar la página.
let entrando = false;
// Recaudación en vivo (caja + Control de Transferencias). Si todavía no existe o no abre, el
// panel sigue con lo que trae data.enc.json.
/* FACTURAS A PAGAR: las impagas de la pestaña "Pago proveedores" del panel de ventas (misma
   tabla de la base), que trae el robot flujo-vivo. Cada una se suma en la columna de su
   proveedor el día que vence; las vencidas antes del 1° del mes en curso, a la fila VENCIDO de
   este mes. Cuando se pagan en Gescom desaparecen solas. Se pueden apagar en ⚙️ Opciones. */
let FACT = { dia:{}, venc:{}, n:0, total:0, otraMoneda:0 };
// columna de un proveedor: la elegida a mano en ⚙️ Opciones ('no' = no sumar), si no la columna de
// proveedor cuyo nombre aparece en la razón social, si no una de gastos (DIGIP, GESCOM…), si no RESTO
const NO_PALABRAS = new Set(['DEPO','DEPOSITO','SEMANAL','SEMANALES','EXTRAS','HORAS','TASA','MUNI','IMP','RESTO','PROVEEDORES']);
function colAuto(nombre){
  const n = norm(nombre);
  for (const tipos of [['proveedor'],['gasto']]) for (const c of E.columnas) {
    if (!tipos.includes(c.tipo) || c.key==='resto' || c.auto) continue;
    const toks = norm(c.nombre).split(/[^A-Z0-9]+/).filter(t=>t.length>=(c.tipo==='proveedor'?3:4) && !NO_PALABRAS.has(t));
    if (toks.some(t=>n.includes(t))) return c.key;
  }
  return null;
}
function colDeProveedor(nombre, codigo){
  const elegida = E.mapaProv && E.mapaProv[codigo];
  if (elegida==='no') return null;
  if (elegida && E.columnas.some(c=>c.key===elegida)) return elegida;
  const auto = colAuto(nombre); if (auto) return auto;
  return 'gp_'+codigo;
}
// "PRIMEROS PRODUCTOS PEHUENIAS S.A." → "PRIMEROS PRODUCTOS PEHUENIAS"
function nombreCorto(n){
  const w=String(n||'').toUpperCase().trim().split(/\s+/);
  while (w.length>1 && /^(S|A|I|C|F|Y|SA|SRL|SAS|SACI|SAIC|SAICA|SACIFYA)$/.test(w[w.length-1].replace(/\./g,''))) w.pop();
  return w.join(' ').slice(0,30);
}
/* PROVEEDORES ORGANIZADOS: cada proveedor con facturas impagas que no tiene columna propia recibe
   una columna automática (auto:true); la que se queda sin facturas y sin montos cargados a mano
   se borra sola. En cada mes se muestran solo los proveedores que tienen algo ese mes. */
function ordenarColumnasProveedor(){
  const tot={};
  for (const x of (VIVO&&VIVO.facturas)||[]) tot['gp_'+x[0]]=(tot['gp_'+x[0]]||0)+x[8];
  const autos=E.columnas.filter(c=>c.auto).sort((a,b)=>(tot[b.key]||0)-(tot[a.key]||0));
  const resto=E.columnas.filter(c=>!c.auto);
  const i=resto.findIndex(c=>c.key==='resto');
  E.columnas = i>=0 ? [...resto.slice(0,i), ...autos, ...resto.slice(i)] : [...resto, ...autos];
}
function indexarFacturas(){
  FACT = { dia:{}, venc:{}, n:0, total:0, otraMoneda:0 };
  if (!VIVO || !VIVO.facturas || E.sumarFacturas===false) return;
  const ini = HOY.slice(0,8)+'01';
  const usadas = new Set(); let cambio = false;
  for (const x of VIVO.facturas){
    const [prov,nombre,tipo,nro,cuota,emp,fecha,vence,saldo,moneda]=x;
    if (moneda && moneda!=='ARS') { FACT.otraMoneda++; continue; }
    const col = colDeProveedor(nombre, prov);
    if (!col) continue;
    if (col.startsWith('gp_') && !E.columnas.some(c=>c.key===col)) {
      E.columnas.push({ key:col, nombre:nombreCorto(nombre), tipo:'proveedor', auto:true });
      cambio = true;
    }
    usadas.add(col);
    const it = { prov, nombre, comp: tipo+' '+nro+(cuota>1?' (cuota '+cuota+')':''), emp, fecha, vence, saldo };
    const dest = vence < ini ? FACT.venc : (FACT.dia[vence] = FACT.dia[vence] || {});
    const cel = dest[col] = dest[col] || { total:0, items:[] };
    cel.total = Math.round((cel.total + saldo)*100)/100; cel.items.push(it);
    FACT.n++; FACT.total += saldo;
  }
  // se borran las columnas automáticas que ya no tienen facturas ni nada cargado a mano
  const conMontos = new Set();
  for (const p of Object.values(E.pagos)) for (const c in p) conMontos.add(c);
  for (const v of Object.values(E.vencido)) for (const c in (v.montos||{})) conMontos.add(c);
  const antes = E.columnas.length;
  E.columnas = E.columnas.filter(c => !c.auto || usadas.has(c.key) || conMontos.has(c.key));

function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function ymd(y,m,d){ return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }

function numero(t){
  if (typeof t==='number') return t;
  let s=String(t||'').trim().replace(/[^0-9.,-]/g,''); if(!s) return NaN;
  const neg=s.startsWith('-'); s=s.replace(/-/g,'');
  if (s.includes('.')&&s.includes(',')) s = s.lastIndexOf(',')>s.lastIndexOf('.') ? s.replace(/\./g,'').replace(',','.') : s.replace(/,/g,'');
  else if (s.includes(',')) s=s.replace(',','.');
  else if (s.includes('.')) { const p=s.split('.'); if (p.length>2 || (p.length===2&&p[1].length===3)) s=p.join(''); }
  const n=parseFloat(s); return neg?-n:n;
}

function grupoExcluido(f,g){ const k=f+'|'+g[0]+'|'+g[1]; if (k in E.exclGrupo) return E.exclGrupo[k]; return reExcl.test(g[1]); }
/* RECAUDACIÓN REAL = Caja Tesorería + Control de Transferencias.
   - Caja: ingresos de la planilla Finanzas_Diarias. En vivo (vivo.enc.json, robot flujo-vivo de
     GitHub) cuando el Apps Script de la caja tiene la acción resumenMes; si no, las planillas de
     W:\Tesoreria (data.enc.json) o lo importado a mano.
   - Transferencias: las que declaró cada fletero en la rendición de su reparto (tipo TRANS), las
     mismas que muestra Control de Transferencias. Las trae el mismo robot desde la base propia.
     Para los días que el Control no tiene (antes del 29/9/2026, cuando la base empezó a guardar
     rendiciones) se usan los créditos de los extractos bancarios, y queda marcado. */
let VIVO = null;
function cajaDe(f){ const v=VIVO&&VIVO.caja&&VIVO.caja[f]; return { items: v || E.caja[f] || [], vivo: !!v }; }
function recaudacion(f){
  const cj = cajaDe(f);
  const caja = cj.items.reduce((a,x)=>a+x[2],0);
  const tItems = (VIVO&&VIVO.transferencias&&VIVO.transferencias[f]) || [];
  const transfControl = tItems.reduce((a,x)=>a+x[2],0);
  const conControl = !!(VIVO&&VIVO.valoresPorTipo&&VIVO.valoresPorTipo[f]);
  // la base guarda rendiciones desde el 29/9/2026: antes de eso no se avisa que "faltan"
  const inicioControl = VIVO&&VIVO.valoresPorTipo ? (recaudacion.ini || (recaudacion.ini=Object.keys(VIVO.valoresPorTipo).sort()[0])) : null;
  const sinRend = (inicioControl && f>=inicioControl && VIVO.sinRendicion && VIVO.sinRendicion[f]) || 0;
  let banco=0, bancoExcl=0;
  for (const g of (E.bancos[f]||[])) { if (grupoExcluido(f,g)) bancoExcl+=g[2]; else banco+=g[2]; }
  const usaBanco = !conControl && banco>0;
  const transf = conControl ? transfControl : (usaBanco ? banco : 0);
  const aj = (E.ajustes[f]||[]).reduce((a,x)=>a+x.monto,0);
  const est = E.estimado[f]||0;
  const hayCaja = cj.items.length>0, hayTransf = conControl || usaBanco;
  const real = caja+transf;
  let usada, fuente;
  const modo = E.modoRec;
  if (modo==='est') { usada=est; fuente='e'; }
  else if (modo==='real') { usada=real; fuente='r'; }
  // mixto: con caja Y transferencias va lo real; si falta una de las dos, se sigue usando la
  // estimada (si hay) para no hundir el saldo con un real a medias, y se marca con "!"
  else if (hayCaja&&hayTransf) { usada=real; fuente='r'; }
  else if ((hayCaja||hayTransf) && !est) { usada=real; fuente='r'; }
  else { usada=est; fuente= est?'e':''; }
  usada += aj;
  const avisos=[];
  if (modo!=='est' && (hayCaja||hayTransf||sinRend)){
    if (fuente==='e') avisos.push(`Real parcial: caja $${f0(caja)||0} + transferencias $${f0(transf)||0}. Se usa la estimada hasta tener las dos`);
    if (!hayCaja) avisos.push('Falta la caja de ese día');
    if (sinRend) avisos.push(`Control de Transferencias: ${sinRend===1?'falta 1 rendición':'faltan '+sinRend+' rendiciones'}`);
    if (usaBanco) avisos.push('Transferencias tomadas de los extractos (el Control no tiene ese día)');
    else if (!hayTransf) avisos.push('Sin transferencias de ese día');
  }
  return {caja,cajaVivo:cj.vivo,cajaItems:cj.items,transf,transfControl,tItems,conControl,sinRend,usaBanco,banco,bancoExcl,aj,est,real,usada,fuente,hayCaja,hayTransf,avisos};
}

  h += `<td>${f0(T.pagos+C.venc.gasto)}</td><td>${f0(T.rec)}</td><td>${f0(T.cheques+C.venc.cheque)}</td><td class="${C.saldoFinal<0?'neg':''}">${fmt0.format(C.saldoFinal)}</td></tr></tfoot></table></div>`;
  // se conserva el desplazamiento al redibujar el mismo mes (marcar, editar, agregar):
  // sin esto la tabla volvía arriba a la izquierda y la celda tocada desaparecía de la vista
  const w0=document.querySelector('.tablawrap'), pos=(w0&&w0.dataset.k===k)?[w0.scrollTop,w0.scrollLeft]:null;
  $('main').innerHTML = h;
  if (pos){ const w1=document.querySelector('.tablawrap'); w1.scrollTop=pos[0]; w1.scrollLeft=pos[1]; }
  $('editSaldoIni').onclick = (e)=>{ e.preventDefault(); editarSaldoIni(); };
}

/* clic = pagado (verde) · doble clic = no pagado (rojo) · clic derecho = editar */
/* 1 clic = verde al instante; el doble clic parte del estado que había ANTES del primer clic,
   así no depende de la velocidad del mouse (Windows da 500 ms para el doble clic). */
let ultClic=null;
$('main').addEventListener('click', e=>{
  const td=e.target.closest('td.m'); if (td){
    if (e.detail>=2) return;                       // el 2° clic de un doble clic lo maneja dblclick
    if (td.dataset.venc){ editarVencido(td.dataset.c); return; }
    const f=td.dataset.f, c=td.dataset.c, v=pagosDe(f)[c];
    if (!v){ editarCelda(f,c); return; }
    const k=f+'|'+c;
    ultClic={k, prev:E.estados[k], t:Date.now()};
    if (E.estados[k]==='ok') delete E.estados[k]; else E.estados[k]='ok';
    guardar(); render();
    return; }
  const rc=e.target.closest('[data-rec]'); if (rc) { detalleRec(rc.dataset.rec); return; }
  const tr=e.target.closest('tr[data-mes]'); if (tr){ mes=+tr.dataset.mes; vista='mes'; render(); return; }
  const cal=e.target.closest('.cal'); if (cal){ mes=+cal.dataset.mes; vista='mes'; render(); }
});
$('main').addEventListener('dblclick', e=>{
  const reciente = ultClic && Date.now()-ultClic.t < 1500 ? ultClic : null; ultClic=null;
  const td=e.target.closest('td.m');
  const k = reciente ? reciente.k : (td&&!td.dataset.venc ? td.dataset.f+'|'+td.dataset.c : null);
  if (!k) return;
  const [f,c]=k.split('|'); if (!pagosDe(f)[c]) return;
  const prev = reciente ? reciente.prev : E.estados[k];
  if (prev==='no') delete E.estados[k]; else E.estados[k]='no';
  guardar(); render();
});
$('main').addEventListener('contextmenu', e=>{
  const td=e.target.closest('td.m'); if (!td) return; e.preventDefault();
  if (td.dataset.venc) editarVencido(td.dataset.c); else editarCelda(td.dataset.f, td.dataset.c);
});

/* ================== modales ================== */
function abrirModal(html){ abrirModal.t=Date.now(); $('modal').innerHTML=html; $('fondo').classList.add('on'); const i=$('modal').querySelector('input'); if(i) i.focus(); }
function cerrarModal(){ $('fondo').classList.remove('on'); }
$('fondo').addEventListener('click', e=>{ if (e.target.id==='fondo' && e.detail<2 && Date.now()-(abrirModal.t||0)>400) cerrarModal(); });
document.addEventListener('keydown', e=>{ if (e.key==='Escape'){ cerrarModal(); $('cajon').classList.remove('abierto'); } });
function nombreCol(k){ return (E.columnas.find(c=>c.key===k)||{nombre:k}).nombre; }
function fechaTxt(f){ const [y,m,d]=f.split('-'); return `${DIAS[new Date(f+'T12:00:00').getDay()]} ${d}/${m}/${y}`; }

function setPago(f,c,monto,nota,origen){
  const prev=(E.pagos[f]||{})[c]||0;
  E.pagos[f]=E.pagos[f]||{};
  E.tocados=E.tocados||{}; E.tocados[f]=1;
  if (!monto) { delete E.pagos[f][c]; delete E.estados[f+'|'+c]; } else E.pagos[f][c]=Math.round(monto*100)/100;
  if (!Object.keys(E.pagos[f]).length) delete E.pagos[f];
  if (nota!==undefined){ if (nota) E.notas[f+'|'+c]=nota; else delete E.notas[f+'|'+c]; }
  registrar(`${origen||'Edición'} · ${fechaTxt(f)} · ${nombreCol(c)}: $${f2(prev)} → $${f2(monto)}${nota?' · '+nota:''}`);
  guardar();
}
function editarCelda(f,c){
  const v=(E.pagos[f]||{})[c]||0, k=f+'|'+c;
  abrirModal(`<h3>${esc(nombreCol(c))}</h3><div class="aviso">${fechaTxt(f)}${E.feriados[f]?' · 🎌 '+esc(E.feriados[f]):''}</div>
   <div class="fila"><label>Monto</label><input id="mMonto" type="text" inputmode="decimal" value="${v?f2(v):''}"></div>
   <div class="fila"><label>Nota</label><input id="mNota" type="text" value="${esc(E.notas[k]||'')}" placeholder="opcional (factura, n° de cheque…)"></div>
   <div class="fila"><label>Estado</label><select id="mEst"><option value="">Pendiente</option><option value="ok" ${E.estados[k]==='ok'?'selected':''}>✔ Pagado (verde)</option><option value="no" ${E.estados[k]==='no'?'selected':''}>✖ No pagado (rojo)</option></select></div>
   <div class="fila"><label>Mover a</label><input id="mFecha" type="date" value="${f}"></div>
   ${listaFacturasHtml(facturasDe(f,c))}
   <div class="fila" style="justify-content:flex-end;margin-top:10px">${v?'<button id="mBorrar">🗑 Quitar</button>':''}<button id="mCanc">Cancelar</button><button class="pri" id="mOk">Guardar</button></div>`);
  $('mCanc').onclick=cerrarModal;
  if ($('mBorrar')) $('mBorrar').onclick=()=>{ setPago(f,c,0,'','Quitado'); cerrarModal(); render(); };
  const ok=()=>{ const n=numero($('mMonto').value)||0, nf=$('mFecha').value||f, nota=$('mNota').value.trim(), st=$('mEst').value;
    if (nf!==f){ setPago(f,c,0,'','Movido'); const ya=(E.pagos[nf]||{})[c]||0; setPago(nf,c,ya+n,nota,'Movido desde '+fechaTxt(f)); if(st) E.estados[nf+'|'+c]=st; }
    else {
      if (Math.round(n*100)/100 !== (v||0)) setPago(f,c,n,nota);
      else if (nota) E.notas[k]=nota; else delete E.notas[k];
      if (st&&(n||facturasDe(f,c))) E.estados[k]=st; else delete E.estados[k]; }
    guardar(); cerrarModal(); render(); };
  $('mOk').onclick=ok; $('modal').querySelectorAll('input').forEach(i=>i.addEventListener('keydown',e=>{ if(e.key==='Enter') ok(); }));
}
function editarVencido(c){
  const k=ym(anio,mes);
  const V=E.vencido[k]?{...E.vencido[k],montos:{...E.vencido[k].montos}}:{texto:'VENCIDO AL 1/'+mes,montos:{}};

   <div class="fila" style="justify-content:flex-end;margin-top:10px"><button id="mCanc">Cancelar</button><button class="pri" id="mOk">Guardar</button></div>`);

function detalleRec(f){
  const R=recaudacion(f), caja=R.cajaItems, bancos=E.bancos[f]||[], aj=E.ajustes[f]||[];
  let h=`<h3>Recaudación · ${fechaTxt(f)}</h3>
   <table><tr><td>💵 Caja Tesorería <span class="aviso">(${R.hayCaja?(R.cajaVivo?'planilla de caja, en vivo':'planilla de caja'):'sin datos de caja'})</span></td><td class="n">$ ${f2(R.caja)}</td></tr>
   <tr><td>🔁 Transferencias <span class="aviso">(${R.conControl?'Control de Transferencias':R.usaBanco?'extractos bancarios':'sin datos'})</span></td><td class="n">$ ${f2(R.transf)}</td></tr>
   <tr><td><b>Recaudado real</b> = caja + transferencias</td><td class="n"><b>$ ${f2(R.real)}</b></td></tr>
   <tr><td>➕ Ajustes manuales</td><td class="n">$ ${f2(R.aj)}</td></tr>
   <tr><td>📈 Estimada</td><td class="n"><input id="rEst" type="text" value="${R.est?f2(R.est):''}" style="width:150px;text-align:right"></td></tr>
   <tr><td><b>Usada en el saldo</b></td><td class="n"><b>$ ${f2(R.usada)}</b></td></tr></table>`;
  if (R.avisos.length) h+=`<div class="aviso" style="color:#b4590f">⚠️ ${R.avisos.map(esc).join('<br>⚠️ ')}</div>`;
  if (R.tItems.length){ h+=`<h4 style="margin:12px 0 4px">Control de Transferencias — por reparto</h4><table><tr><th>Ruta</th><th>Fletero</th><th class="n">Transf.</th><th class="n">Importe</th></tr>`;
    R.tItems.forEach(t=>{ h+=`<tr><td>${esc(t[0])}</td><td>${esc(t[1])}</td><td class="n">${t[3]}</td><td class="n">${f2(t[2])}</td></tr>`; });
    h+='</table>'; }
  if (bancos.length && !R.usaBanco){ h+=`<details><summary style="cursor:pointer;margin-top:10px">Extractos bancarios de ese día (referencia: no se suman, las transferencias salen del Control)</summary><table>`;
    bancos.forEach(g=>{ h+=`<tr><td>${esc(g[0])}</td><td>${esc(g[1])}</td><td class="n">${g[3]}</td><td class="n">${f2(g[2])}</td></tr>`; }); h+='</table></details>'; }
  if (bancos.length && R.usaBanco){ h+=`<h4 style="margin:12px 0 4px">Extractos bancarios (reemplazan al Control ese día) — tildá lo que es recaudación</h4><table><tr><th></th><th>Cuenta</th><th>Concepto</th><th class="n">Mov.</th><th class="n">Importe</th></tr>`;
    bancos.forEach((g,i)=>{ h+=`<tr><td><input type="checkbox" data-g="${i}" ${grupoExcluido(f,g)?'':'checked'}></td><td>${esc(g[0])}</td><td>${esc(g[1])}</td><td class="n">${g[3]}</td><td class="n">${f2(g[2])}</td></tr>`; });
    h+=`</table><div class="aviso">Los depósitos en efectivo vienen destildados: esa plata ya se contó al entrar a la caja (y sale de la caja como "DEPOSITO BANCARIO").</div>`; }
  if (caja.length){ h+=`<details><summary style="cursor:pointer;margin-top:10px">Detalle caja (${caja.length} ingresos)</summary><table>`;
    caja.forEach(x=>{ h+=`<tr><td>${esc(x[0])}</td><td>${esc(x[1])}</td><td class="n">${f2(x[2])}</td></tr>`; }); h+='</table></details>'; }
  h+=`<h4 style="margin:12px 0 4px">Ajustes</h4><div class="lista" id="rAjs">${aj.map(a=>`<div><span>${esc(a.nota||'Ajuste')}</span><span class="x">$ ${f2(a.monto)}</span><button data-del="${a.id}">✕</button></div>`).join('')||'<div>Sin ajustes</div>'}</div>
   <div class="fila" style="margin-top:6px"><input id="rAjM" type="text" placeholder="Monto (+ suma / − resta)" style="max-width:170px"><input id="rAjN" type="text" placeholder="Motivo"><button id="rAjAdd">Agregar</button></div>
   <div class="fila" style="justify-content:flex-end;margin-top:10px"><button id="mCanc">Cerrar</button><button class="pri" id="mOk">Guardar</button></div>`;
  abrirModal(h);
  $('mCanc').onclick=cerrarModal;
  $('modal').querySelectorAll('[data-g]').forEach(cb=>cb.onchange=()=>{ const g=bancos[+cb.dataset.g]; E.exclGrupo[f+'|'+g[0]+'|'+g[1]]=!cb.checked; guardar(); render(); });

  $('rAjAdd').onclick=()=>{ const n=numero($('rAjM').value); if(!n) return; (E.ajustes[f]=E.ajustes[f]||[]).push({id:Date.now().toString(36),monto:n,nota:$('rAjN').value.trim()});
    registrar(`Ajuste recaudación · ${fechaTxt(f)}: $${f2(n)} ${$('rAjN').value.trim()}`); guardar(); render(); detalleRec(f); };
  $('mOk').onclick=()=>{ const n=numero($('rEst').value)||0; if(n) E.estimado[f]=n; else delete E.estimado[f]; guardar(); cerrarModal(); render(); };
}

/* ================== vista anual ================== */
function renderAnio(){
  let filas='', tot={venc:0,pagos:0,cheques:0,real:0,est:0,rec:0,caja:0,transf:0,pagado:0}; const cals=[];
  for (let m=1;m<=12;m++){
    const C=calcularMes(anio,m), T=C.tot, hay=tieneDatos(anio,m)||T.recReal;
    tot.venc+=C.venc.total; tot.pagos+=T.pagos; tot.cheques+=T.cheques; tot.real+=T.recReal; tot.est+=T.recEst; tot.rec+=T.rec; tot.caja+=T.caja; tot.transf+=T.transf; tot.pagado+=T.pagado;
    const nF=C.filas.filter(r=>tipoDia(r.f)==='feriado').length, nW=C.filas.filter(r=>tipoDia(r.f)==='finde').length, nH=C.filas.length-nF-nW;
    filas+=`<tr class="click" data-mes="${m}"><td>${MESES[m-1]}</td><td>${nH} / ${nW} / ${nF}</td><td>${f0(C.venc.total)}</td><td>${f0(T.pagos)}</td><td>${f0(T.cheques)}</td><td>${f0(T.caja)}</td><td>${f0(T.transf)}</td><td>${f0(T.recReal)}</td><td>${f0(T.recEst)}</td><td>${f0(T.rec)}</td><td>${T.pagos+T.cheques?Math.round(T.pagado/(T.pagos+T.cheques)*100)+'%':''}</td><td class="${C.saldoFinal<0?'neg':''}">${hay?fmt0.format(C.saldoFinal):''}</td></tr>`;
    // calendario
    const ini=(new Date(anio,m-1,1).getDay()+6)%7; let g='<div class="dn">L</div><div class="dn">M</div><div class="dn">M</div><div class="dn">J</div><div class="dn">V</div><div class="dn">S</div><div class="dn">D</div>';
    for(let i=0;i<ini;i++) g+='<div></div>';
    for (const r of C.filas){ const t=tipoDia(r.f), neto=r.r.usada-r.pagos-r.cheques;
      g+=`<div class="${t==='feriado'?'fe':t==='finde'?'fd':''} ${r.f===HOY?'hy':''} ${(r.pagos||r.cheques||r.r.usada)?(neto>=0?'pos':'ng'):''}" title="${fechaTxt(r.f)}${E.feriados[r.f]?' · '+esc(E.feriados[r.f]):''}\nPagos $${f0(r.pagos)||0} · Cheques $${f0(r.cheques)||0}\nRecaudación $${f0(r.r.usada)||0}\nSaldo $${fmt0.format(r.saldo)}">${r.d}</div>`; }
    cals.push(`<div class="cal" data-mes="${m}"><h4><span>${MESES[m-1]}</span><span class="${C.saldoFinal<0?'neg':''}" style="font-weight:400;font-size:11px">${hay?'$ '+fmt0.format(C.saldoFinal):''}</span></h4><div class="g">${g}</div></div>`);
  }
  $('main').innerHTML = `<div class="tarjetas">
    <div class="tarjeta"><div class="t">Pagos del año</div><div class="v">$ ${f0(tot.pagos)||0}</div></div>
    <div class="tarjeta"><div class="t">Cheques del año</div><div class="v">$ ${f0(tot.cheques)||0}</div></div>
    <div class="tarjeta"><div class="t">Recaudado real</div><div class="v">$ ${f0(tot.real)||0}</div><div class="s">Caja $ ${f0(tot.caja)||0} · Transferencias $ ${f0(tot.transf)||0}</div></div>
    <div class="tarjeta"><div class="t">Recaudación estimada</div><div class="v">$ ${f0(tot.est)||0}</div></div>
    <div class="tarjeta"><div class="t">Marcado como pagado</div><div class="v" style="color:var(--verdeb)">$ ${f0(tot.pagado)||0}</div></div></div>
   <div class="anual"><table><tr><th>Mes</th><th title="hábiles / fin de semana / feriados">Días háb./finde/fer.</th><th>Vencido inicial</th><th>Pagos</th><th>Cheques</th><th>Caja tesorería</th><th>Transferencias</th><th>Recaudado real</th><th>Estimado</th><th>Recaudación usada</th><th>% pagado</th><th>Saldo cierre</th></tr>${filas}
   <tr><td><b>Total ${anio}</b></td><td></td><td><b>${f0(tot.venc)}</b></td><td><b>${f0(tot.pagos)}</b></td><td><b>${f0(tot.cheques)}</b></td><td><b>${f0(tot.caja)}</b></td><td><b>${f0(tot.transf)}</b></td><td><b>${f0(tot.real)}</b></td><td><b>${f0(tot.est)}</b></td><td><b>${f0(tot.rec)}</b></td><td></td><td></td></tr></table></div>
   <div class="leyenda" style="margin-top:12px"><span><i style="background:var(--finde)"></i>Fin de semana</span><span><i style="background:var(--feriado)"></i>Feriado</span><span><i style="box-shadow:inset 0 -3px 0 #43a047"></i>Día con neto positivo</span><span><i style="box-shadow:inset 0 -3px 0 #e53935"></i>Día con neto negativo</span><span>Clic en un mes para abrirlo</span></div>
   <div class="calendarios">${cals.join('')}</div>`;
}

async function leerFilas(file){
  const buf=await file.arrayBuffer();
  if (/\.csv$/i.test(file.name)) { const wb=XLSX.read(new TextDecoder().decode(buf),{type:'string'}); return {wb, filas:XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''})}; }
  const wb=XLSX.read(new Uint8Array(buf),{type:'array',cellDates:true});
  return {wb, filas:XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''})};
}
function norm(t){ return String(t??'').normalize('NFD').replace(/\p{M}/gu,'').toUpperCase().trim().replace(/\s+/g,' '); }
function fechaCelda(v){
  if (v instanceof Date) return iso(new Date(v.getTime()+12*3600e3));
  const t=String(v||'').trim(); let m;
  if (/^\d{5}(\.\d+)?$/.test(t)) return new Date((parseFloat(t)-25569)*864e5+12*3600e3).toISOString().slice(0,10);
  if ((m=t.match(/^(\d{4})-(\d{2})-(\d{2})/))) return m[0];
  if ((m=t.match(/^(\d{1,2})[/-](\d{1,2})[/-](\d{2,4})/))) return `${m[3].length===2?'20'+m[3]:m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return null;
}
function conceptoBanco(det){
  let c=String(det||'').split(' · ')[0].replace(/[\d:/#-]+/g,' ').replace(/\s+/g,' ').trim().slice(0,40)||'Credito';
  if (/^cr transferencia recibida/i.test(c)) c='CR Transferencia Recibida';
  else if (/^g\.? ?de echeq/i.test(c)) c='Gestion de Echeq';
  else if (/^dep\.?efvo/i.test(c)) c='Deposito En Efectivo';
  else if (/^(ING )?TRANSF /i.test(c)) c='Transferencia Recibida';
  return c;
}
function importarBanco(filas, nombre){
  let hr=-1; for (let i=0;i<Math.min(40,filas.length);i++){ const n=(filas[i]||[]).map(norm);
    if (n.some(x=>x.startsWith('FECHA')) && n.some(x=>/^(CREDITO|MONTO|IMPORTE)/.test(x))) { hr=i; break; } }
  if (hr<0) return null;
  const H=filas[hr].map(norm), idx=re=>H.findIndex(x=>re.test(x));
  const cf=idx(/^FECHA/), cc=idx(/^CREDITO/), cm=idx(/^(MONTO|IMPORTE)/), cd=idx(/^(DESCRIPCION|CONCEPTO|DETALLE)/);
  const cab=filas.slice(0,8).concat(filas.slice(-8)).map(f=>norm((f||[]).join(' '))).join(' ');
  const hall=H.join(' ');
  let banco = /LEYENDAS ADICIONALES/.test(hall)?'Galicia': /CAUSAL/.test(hall)?'Provincia': /NACION|BNA/.test(cab)?'Nación': (/GALICIA/.test(cab)?'Galicia':/PROVINCIA/.test(cab)?'Provincia':'Banco');
  const cta=(nombre.match(/_(CC\d+)/)||[])[1]; const emp=(cab.match(/EMPRESA:\s*\d*\s*-?\s*([A-Z .]{4,40}?)(?:\s+OPERADOR|\s{2}|$)/)||[])[1];
  const cuenta=banco+(cta?' '+cta:'')+(emp?' - '+emp.trim():'');
  const agg={};
  for (const r of filas.slice(hr+1)){ const f=fechaCelda(r[cf]); if(!f) continue;
    let imp = cc>=0 ? numero(r[cc]) : NaN; if (!(imp>0) && cm>=0) imp=numero(r[cm]);
    if (!(imp>0)) continue;
    const con=conceptoBanco(cd>=0?r[cd]:''); const k=f+'\u0001'+con; const a=agg[k]||(agg[k]=[0,0]); a[0]+=imp; a[1]++; }
  const dias=new Set(Object.keys(agg).map(k=>k.split('\u0001')[0]));
  for (const f of dias) E.bancos[f]=(E.bancos[f]||[]).filter(g=>g[0]!==cuenta);
  let total=0;
  for (const [k,[imp,n]] of Object.entries(agg)){ const [f,con]=k.split('\u0001'); (E.bancos[f]=E.bancos[f]||[]).push([cuenta,con,Math.round(imp*100)/100,n]); total+=imp; }
  const ds=[...dias].sort();
  return `🏦 ${cuenta}: ${ds.length} días (${ds[0]||''} a ${ds[ds.length-1]||''}), créditos $ ${f0(total)}`;
}
function importarCaja(wb){
  const ws=wb.Sheets['Movimientos']; if(!ws) return null;
  const filas=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
  const nuevo={}; let n=0;
  for (const r of filas.slice(1)){ const f=fechaCelda(r[0]); if(!f) continue; if (norm(r[1])!=='INGRESO') continue;
    const imp=numero(r[10]); if(!imp) continue; (nuevo[f]=nuevo[f]||[]).push([String(r[4]||'').trim(),String(r[2]||'').trim(),imp]); n++; }
  for (const f in nuevo) E.caja[f]=nuevo[f];
  const ds=Object.keys(nuevo).sort();
  return `💵 Caja: ${n} ingresos en ${ds.length} días (${ds[0]||''} a ${ds[ds.length-1]||''})`;
}
const MAPEO=[['sueldos',/^SUELDOS/],['premios',/^PREMIOS/],['horas',/^HORAS EXTRAS/],['aportes',/APORTES/],['viaticos',/^VIATICOS/],['alquiler',/^ALQUILER/],['fletes',/^FLETES/],['garrafas',/^GARRAFAS/],['contenedores',/^CONTENEDORES/],['sistemas',/^DIGIP/],['comafi',/^PRESTAMO COMAFI/],['echeqcomafi',/^ECHEQ COMAFI/],['estudio',/^ESTUDIO/],['chq_tp',/^E-CHEQS (PEPSICO|TP|TIENDA)$/],['chq_rl',/^E-CHEQS (RAMBLA|RL)$/],['despidos',/^DESPIDOS/],['prestamos',/^PRESTAMOS$/],['moratorias',/^MORATORIAS/],['impuestos',/^IMPUESTOS/],['softys',/^SOFTYS/],['pepsico',/^PEPSICO$/],['georgalos',/^GEORGALOS/],['chacabuco',/^CHACABUCO/],['bimbo',/^BIMBO/],['ecovita',/^ECOVITA/],['entrenuts',/^ENTRENUTS/],['pilaga',/^PILAGA/],['resto',/^RESTO/]];
function importarFlujo(filas){
  const hr=filas.findIndex(r=>norm(r[0]).startsWith('VENCIMIENTO')); if (hr<0) return null;
  const H=filas[hr].map(norm), cols={}; let rec=-1; const nuevas=[];
  H.forEach((h,i)=>{ if(!i||!h) return; if (h.startsWith('RECAUDACION')) { rec=i; return; }
    if (/^(TOTAL|SALDO|CHEQUES A PAGAR|ECHEQS|%)/.test(h)) return;
    let k=(MAPEO.find(([,re])=>re.test(h))||[])[0];
    if (!k){ let c=E.columnas.find(c=>norm(c.nombre)===h); if(!c){ c={key:'c_'+Math.random().toString(36).slice(2,8),nombre:h,tipo:/CHEQ/.test(h)?'cheque':'proveedor'}; E.columnas.push(c); nuevas.push(h);} k=c.key; }
    else if (!E.columnas.find(c=>c.key===k)) E.columnas.push({key:k,nombre:h,tipo:/^chq/.test(k)?'cheque':'proveedor'});
    cols[i]=k; });
  let mesK=null, dias=0;
  for (const r of filas.slice(hr+1)){
    const f=fechaCelda(r[0]);
    if (f){ mesK=mesK||f.slice(0,7); const p={};
      for (const [i,k] of Object.entries(cols)){ const v=numero(r[i]); if (v) p[k]=(p[k]||0)+v; }
      if (Object.keys(p).length) E.pagos[f]=p; else delete E.pagos[f];
      E.tocados=E.tocados||{}; E.tocados[f]=1;
      const v=rec>=0?numero(r[rec]):0; if (v) E.estimado[f]=v; else delete E.estimado[f]; dias++; }
    else if (norm(r[0]).startsWith('VENCIDO')){ const m={}; for (const [i,k] of Object.entries(cols)){ const v=numero(r[i]); if(v) m[k]=v; }
      const fr=filas.slice(hr+1).map(x=>fechaCelda(x[0])).find(Boolean); if (fr) E.vencido[fr.slice(0,7)]={texto:String(r[0]).trim(),montos:m}; }
  }
  return `📊 Flujo ${mesK}: ${dias} días cargados${nuevas.length?' · columnas nuevas: '+nuevas.join(', '):''}`;
}
async function importar(files){
  const res=[];
  for (const file of files){
    try{
      if (/\.json$/i.test(file.name)){ const d=JSON.parse(await file.text()); if(!d.columnas) throw new Error('no es un respaldo de esta planilla');
        if (!confirm('Esto reemplaza TODO lo cargado por el respaldo "'+file.name+'". ¿Seguir?')) continue; E=d; recExcl(); res.push('✅ Respaldo restaurado'); continue; }
      const {wb,filas}=await leerFilas(file);
      let r = wb.Sheets['Movimientos'] ? importarCaja(wb) : null;
      if (!r && filas.some(x=>norm(x[0]).startsWith('VENCIMIENTO'))) r=importarFlujo(filas);
      if (!r) r=importarBanco(filas, file.name);
      res.push(r ? r+' — '+file.name : '⚠️ No reconocí '+file.name);
      if (r) registrar('Importado: '+file.name);
    } catch(e){ res.push('⚠️ '+file.name+': '+e.message); }
  }
  guardar(); render();
  if ($('impRes')) $('impRes').innerHTML=res.map(esc).join('<br>'); else toast(res.join(' · '));
}

function exportarExcel(){
  const C=calcularMes(anio,mes), cols=colsDelMes(anio,mes), k=ym(anio,mes), vm=vencidoMontos(k);
  const aoa=[[`FLUJO DE CAJA TP-RL — ${MESES[mes-1].toUpperCase()} ${anio}`],['VENCIMIENTO',...cols.map(c=>c.nombre),'TOTAL PAGOS A REALIZAR','RECAUDACION REAL Y ESTIMADA','TOTAL $ CHEQUES','SALDO DE CAJA','RECAUDADO CAJA','TRANSFERENCIAS','RECAUDACION ESTIMADA','FERIADO']];
  aoa.push([(E.vencido[k]||{}).texto||'VENCIDO',...cols.map(c=>vm[c.key]||null),C.venc.gasto||null,null,C.venc.cheque||null,C.saldoIni-C.venc.total]);
  for (const r of C.filas){ const p=pagosDe(r.f); const [y,m,d]=r.f.split('-');
    aoa.push([`${d}/${m}/${y}`,...cols.map(c=>p[c.key]||null),r.pagos||0,r.r.usada||null,r.cheques||null,r.saldo,r.r.caja||null,r.r.transf||null,r.r.est||null,E.feriados[r.f]||(tipoDia(r.f)==='finde'?'fin de semana':'')]); }
  aoa.push(['TOTAL',...cols.map(c=>(C.tot.porCol[c.key]||0)+(vm[c.key]||0)),C.tot.pagos+C.venc.gasto,C.tot.rec,C.tot.cheques+C.venc.cheque,C.saldoFinal,C.tot.caja,C.tot.transf,C.tot.recEst]);
  const ws=XLSX.utils.aoa_to_sheet(aoa); ws['!cols']=[{wch:14},...cols.map(()=>({wch:14})),{wch:16},{wch:16},{wch:16},{wch:16}];
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'FLUJO DE CAJA TP-RL');
  XLSX.writeFile(wb,`Flujo Caja vs Pagos futuros - TP-RL - ${MESES[mes-1].toUpperCase()} ${anio}.xlsx`);
}

/* ================== navegación ================== */
$('selMes').innerHTML=MESES.map((m,i)=>`<option value="${i+1}">${m}</option>`).join('');
$('selAnio').innerHTML=[2025,2026,2027,2028].map(y=>`<option>${y}</option>`).join('');
$('selMes').onchange=e=>{ mes=+e.target.value; render(); };
$('selAnio').onchange=e=>{ anio=+e.target.value; render(); };
$('modoRec').onchange=e=>{ E.modoRec=e.target.value; guardar(); render(); };
document.querySelectorAll('#vistaSeg button').forEach(b=>b.onclick=()=>{ vista=b.dataset.v; render(); });
$('ant').onclick=()=>{ if (vista==='anio') anio--; else if (--mes<1){ mes=12; anio--; } render(); };
$('sig').onclick=()=>{ if (vista==='anio') anio++; else if (++mes>12){ mes=1; anio++; } render(); };
$('btnHoy').onclick=()=>{ anio=hoy.getFullYear(); mes=hoy.getMonth()+1; render(); setTimeout(()=>{ irAHoy(); },50); };
function irAHoy(){ const tr=document.querySelector('tr.hoy'), w=document.querySelector('.tablawrap'); if(tr&&w) w.scrollTop=Math.max(0,tr.offsetTop-w.clientHeight/2); }
{ let k=null; try { k=sessionStorage.getItem('flujo-k'); } catch(_){} if (k) entrar(k); }
